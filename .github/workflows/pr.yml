name: PR

on: pull_request

permissions: read-all

jobs:
  tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - name: Checkout terragoat
        uses: actions/checkout@v6
        with:
          path: terragoat
          repository: bridgecrewio/terragoat

      - name: Scan terragoat
        uses: ./
        with:
          directory: terragoat
          soft_fail: true  # don't want to fail the step, because of found findings
